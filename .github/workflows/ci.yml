name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the repository, so their token can only read it.
permissions:
  contents: read

# Both jobs run only in Ember's own repository and on pull requests to it: the copies Deploy to
# Cloudflare makes of it skip them, so they don't spend their owners' Actions minutes.
jobs:
  check:
    if: github.repository == 'NYLLON-SOFTWARE/ember-cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Released migrations stay as they are
        # Deployments apply each migration once, by name, so a change to a released one would reach
        # only new deployments, never those that update: a schema change goes in a new migration. A
        # beta's are released too, to the copies that take it.
        run: |
          # Apart from a pipe, so a failed lookup fails the step rather than reading as no releases.
          # Newest first, with a beta, such as v1.2.0-beta.1, before its release, which has all it has.
          releases=$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname origin 'refs/tags/v*')
          release=$(echo "$releases" | head -n 1 | cut -f 2)
          if [ -z "$release" ]; then exit 0; fi
          git fetch --quiet --no-tags --depth=1 origin "+$release:$release"
          changed=$(git diff --name-only --no-renames --diff-filter=DMT "$release" HEAD -- apps/worker/migrations apps/worker/search-migrations)
          if [ -n "$changed" ]; then
            echo "::error::${release#refs/tags/} released these migrations, so they can't change; add a new one instead:" $changed
            exit 1
          fi
      - name: Copies are offered Ember's Update Ember workflow
        # A copy without the workflow is offered the one kept beside the deploy script, by the deploy and
        # by General's release card, and the tests read that one, since a copy's .github keeps its own
        # workflow, or none. Only Ember's own .github has Ember's, to check it against.
        run: |
          if ! diff -u .github/workflows/update-ember.yml apps/worker/scripts/update-ember.yml; then
            echo "::error::Copies are offered apps/worker/scripts/update-ember.yml, which has to match .github/workflows/update-ember.yml: copy that over it."
            exit 1
          fi
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    if: github.repository == 'NYLLON-SOFTWARE/ember-cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ember/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
